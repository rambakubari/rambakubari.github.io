button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #6aa7ff;outline-offset:2px}

/* Envelope */
#envelope{display:block;width:100%;aspect-ratio:3/2;max-width:440px;margin:10vh auto 0;border:0;padding:0;cursor:pointer;position:relative;background:var(--env);border-radius:4px;
 box-shadow:0 18px 40px rgba(0,0,0,.4);overflow:hidden;transition:transform .5s,opacity .5s}
#envelope.stripes::before{content:"";position:absolute;inset:0;border:10px solid transparent;pointer-events:none;
 border-image:repeating-linear-gradient(135deg,#c8372d 0 14px,transparent 14px 28px,#2a5d9f 28px 42px,transparent 42px 56px) 10}
.flap{position:absolute;left:0;right:0;top:0;height:58%;background:rgba(0,0,0,.08);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s}
.to{position:absolute;left:0;right:0;bottom:16%;font-family:"Kalam",cursive;font-size:clamp(20px,5vw,28px);color:#23303a}
.seal{position:absolute;left:50%;top:44%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--accent);display:grid;place-items:center;
 color:#fff;font-size:24px;box-shadow:0 3px 6px rgba(0,0,0,.4);transition:transform .4s,opacity .4s;filter:saturate(1.1)}
#envelope:hover .seal{transform:scale(1.1)}
#envelope.open{transform:translateY(30px);opacity:0;pointer-events:none}
#envelope.open .flap{transform:rotateX(180deg)}
.hint{color:#fff;opacity:.6;font-family:"Kalam",cursive;margin-top:18px}

/* Book */
#bookWrap{display:none}
#bookWrap.show{display:block;animation:rise .6s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
#book{position:relative;width:100%;aspect-ratio:7/5;perspective:2400px;margin:8px 0 18px;container-type:inline-size;transition:transform .9s cubic-bezier(.5,.1,.2,1)}
.leaf{position:absolute;top:0;bottom:0;left:50%;width:50%;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.5,.1,.2,1),opacity .2s}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:0 8px 8px 0;overflow:hidden;
 background:var(--paper);box-shadow:2px 0 0 #ece8db,4px 0 0 #d6d2c3,5px 1px 0 #aaa597;text-align:left}
.face.back{transform:rotateY(180deg);border-radius:8px 0 0 8px;box-shadow:-2px 0 0 #ece8db,-4px 0 0 #d6d2c3,-5px 1px 0 #aaa597}
.page{position:absolute;inset:0;padding:clamp(12px,5cqw,34px);overflow:auto;font-size:clamp(11px,2.1cqw,19px);line-height:1.65;
 background-image:var(--pbg);background-size:cover;background-position:center;scrollbar-width:thin}
.page::after{content:"";position:absolute;left:0;top:0;bottom:0;width:14%;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,.05) 40%,transparent);pointer-events:none}
.page p{margin:0 0 1em}
.face.back .page::after{left:auto;right:0;background:linear-gradient(270deg,rgba(0,0,0,.22),rgba(0,0,0,.05) 40%,transparent)}
.pnum{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:13px;opacity:.5}
.cover{display:grid;place-content:center;text-align:center;gap:10px;background:var(--accent);color:#fff;background-image:var(--cover);background-size:cover;background-position:center}
.cover::before{content:"";position:absolute;inset:14px;border:2px solid rgba(255,255,255,.55);pointer-events:none}
.cover h1{font-size:clamp(18px,4.4cqw,38px);margin:0;line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.cover small{font-size:clamp(11px,1.9cqw,16px);text-shadow:0 1px 6px rgba(0,0,0,.5)}

.tag{background:linear-gradient(transparent 58%,rgba(255,200,40,.6) 58%);border:0;padding:0 2px;cursor:pointer;border-radius:2px}
.tag:hover,.tag[aria-expanded="true"]{background:rgba(255,200,40,.85)}
.pnote{position:absolute;left:16px;right:16px;bottom:30px;background:#fff8dd;color:#4a3d12;font-family:"Kalam",cursive;font-size:clamp(11px,1.9cqw,16px);line-height:1.4;
 padding:10px 14px;border-left:4px solid #e6b422;box-shadow:0 3px 10px rgba(0,0,0,.25);transform:rotate(-.6deg);display:none}
.pnote.show{display:block}
/* Hardcover board, page edges, flip shading */
#book::before{content:"";position:absolute;top:-10px;bottom:-10px;left:-10px;right:-10px;z-index:-1;border-radius:8px;background:color-mix(in srgb,var(--accent) 62%,#000);
 box-shadow:0 22px 45px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,255,255,.1);transition:left .9s cubic-bezier(.5,.1,.2,1),right .9s cubic-bezier(.5,.1,.2,1)}
#book.s-front::before{left:calc(50% - 4px);right:-10px}
#book.s-back::before{left:-10px;right:calc(50% - 4px)}
.face:has(>.cover){box-shadow:none}
.cover{box-shadow:inset 0 0 50px rgba(0,0,0,.35)}
.page.cover::after{left:22px;width:4px;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(255,255,255,.2))}
.face.back .page.cover::after{left:auto;right:22px;background:linear-gradient(270deg,rgba(0,0,0,.4),rgba(255,255,255,.2))}
.face::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(0,0,0,.45),transparent 70%)}
.face.back::before{background:linear-gradient(270deg,rgba(0,0,0,.45),transparent 70%)}
.leaf.flipping .face::before{animation:shade .9s ease-in-out}
@keyframes shade{50%{opacity:1}}
#envelope.shake{animation:shake .5s ease-in-out}
@keyframes shake{0%,100%{transform:none}
 15%{transform:translateX(calc(var(--amp)*-1px)) rotate(calc(var(--amp)*-.35deg))}
 35%{transform:translateX(calc(var(--amp)*1px)) rotate(calc(var(--amp)*.35deg))}
 55%{transform:translateX(calc(var(--amp)*-.7px)) rotate(calc(var(--amp)*-.25deg))}
 75%{transform:translateX(calc(var(--amp)*.5px)) rotate(calc(var(--amp)*.15deg))}}
/* Flat paper look: no hardcover, no stacked edges */
#book::before{display:none}
.face,.face.back,.face:has(>.cover){box-shadow:0 10px 28px rgba(0,0,0,.35)}
.face{border-radius:0 3px 3px 0}
.face.back{border-radius:3px 0 0 3px}
.page::after{width:8%;opacity:.5}
.page.cover::after,.face.back .page.cover::after{display:none}
.cover{box-shadow:none}

.nav{display:none;justify-content:center;align-items:center;gap:16px;color:#fff}
.nav button,.btn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 20px;cursor:pointer}
.nav button:hover:not(:disabled),.btn:hover{background:rgba(255,255,255,.28)}
.nav button:disabled{opacity:.35;cursor:default}
#count{min-width:70px;font-size:14px}

/* Designer */
#gear{position:fixed;right:14px;top:calc(14px + env(safe-area-inset-top,0px));z-index:20}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(340px,100%);background:#fbfaf6;color:#222;z-index:30;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 28px;overflow:auto;
 transform:translateX(105%);transition:transform .35s;box-shadow:-10px 0 30px rgba(0,0,0,.35);text-align:left;font-family:system-ui,sans-serif;font-size:14px}
#panel.show{transform:none}
#panel h2{margin:0 0 4px;font-size:18px}
#panel fieldset{border:0;border-top:1px solid #ddd;margin:14px 0 0;padding:10px 0 0}
#panel legend{font-weight:700;padding-right:8px}
#panel label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
#panel input[type=text],#panel select,#panel textarea{width:60%;font:inherit;padding:6px;border:1px solid #bbb;border-radius:4px;background:#fff;color:#222}
#panel textarea{width:100%;min-height:200px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
#panel input[type=color]{width:46px;height:30px;padding:0;border:1px solid #bbb;background:none}
#panel input[type=file]{width:60%;font-size:12px}
#panel .help{color:#666;font-size:12.5px;line-height:1.45;margin:4px 0}
#panel .btn{background:#222;border-color:#222;color:#fff;margin-top:10px;padding:7px 16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Custom envelope image */
#envelope{background:none;box-shadow:none;overflow:visible;border-radius:0;aspect-ratio:1000/715;max-width:520px;filter:drop-shadow(0 18px 22px rgba(0,0,0,.45))}
#envelope img{width:100%;height:100%;display:block;pointer-events:none}
#envelope.stripes::before,.flap,.seal,.to{display:none}
#panel label:has(#to),#panel label:has(#seal),#panel label:has(#env),#panel label:has(#stripes){display:none}
.cover.end{background-image:none}
.nt .cover:not(.end) h1,.nt .cover:not(.end) small{display:none}
.nt .cover:not(.end)::before{display:none}
/* Art pages, photo spots, letter modal */
.ph{position:absolute;inset:0;background:center/cover no-repeat;
 filter:sepia(calc(var(--vf,.8)*.3)) saturate(calc(1 + var(--vf,.8)*.15)) contrast(calc(1 - var(--vf,.8)*.1)) brightness(calc(1 + var(--vf,.8)*.07)) hue-rotate(calc(var(--vf,.8)*-6deg))}
.ph::after{content:"";position:absolute;inset:0;opacity:var(--vf,.8);
 background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(60,30,10,.4) 100%),linear-gradient(rgba(255,200,120,.12),rgba(255,200,120,.12));box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.ph[hidden]{display:none}
.spot i{position:relative;z-index:1}
.bw .ph{filter:grayscale(1) contrast(calc(1 + var(--vf,.8)*.15)) brightness(calc(1 + var(--vf,.8)*.05))}
.bw .ph::after{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
.nf .ph{filter:none}
.nf .ph::after{display:none}
#tip{position:fixed;z-index:35;pointer-events:none;transform:translate(-50%,-100%);background:var(--tipbg,#23303a);color:var(--tipfg,#fff);padding:var(--tipp,7px 12px);border-radius:var(--tipr,8px);max-width:220px;text-align:center;
 font:13px/1.35 system-ui,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#tip[hidden]{display:none}
#tip small{display:block;opacity:.7;font-size:11.5px;margin-top:2px}
#tip::after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--tipbg,#23303a)}
#tip.below{transform:translate(-50%,0)}
.noarrow #tip::after{display:none}
#tipdemo span{display:inline-block;background:var(--tipbg);color:var(--tipfg);padding:var(--tipp);border-radius:var(--tipr);font:13px system-ui,sans-serif;margin:8px 0 2px}
#tip.below::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--tipbg,#23303a)}
#panel .sp input[type=text]{width:100%;margin:6px 0}
#mute{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20}
#mute[hidden]{display:none}
.page.art{padding:0;overflow:hidden}
.artimg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
.spot{position:absolute;border:0;padding:0;cursor:pointer;display:grid;place-items:center;background:linear-gradient(135deg,#ece2cf,#d8c8aa) center/cover no-repeat}
.spot:hover,.spot:focus-visible{filter:brightness(1.1)}
.spot i{font-style:normal;width:clamp(22px,7cqw,40px);height:clamp(22px,7cqw,40px);border-radius:50%;background:rgba(255,255,255,.88);color:#a82a24;display:grid;place-items:center;font-size:clamp(12px,3.6cqw,20px);box-shadow:0 2px 8px rgba(0,0,0,.35);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
.lcard{position:relative;width:100%;max-width:480px;max-height:85vh;overflow:auto;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:32px;padding:32px 28px 32px;border-radius:3px;background-attachment:local;
 background-image:repeating-linear-gradient(transparent 0 31px,rgba(42,93,159,.13) 31px 32px);box-shadow:0 20px 50px rgba(0,0,0,.5);animation:unfold .5s ease-out both;text-align:left}
@keyframes unfold{from{opacity:0;transform:perspective(900px) rotateX(-35deg) translateY(-16px);transform-origin:top}to{opacity:1;transform:none}}
.lcard p{margin:0 0 32px}
.lcard .x{position:absolute;top:4px;right:6px;background:none;border:0;font-size:30px;line-height:1;cursor:pointer;padding:4px 10px;color:var(--ink)}
.lph{width:100%;height:192px;object-fit:cover;border-radius:2px;margin-bottom:32px;display:block}
.lnote{display:none;position:sticky;bottom:0;font-family:"Kalam",cursive;font-size:17px;line-height:26px;background:#fff8dd;color:#4a3d12;padding:10px 14px;border-left:4px solid #e6b422;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.lnote.show{display:block}
#panel .sp{border-top:1px solid #ddd;padding:10px 0}
#panel .sp input[type=file]{width:100%;margin:6px 0}
#panel .sp textarea{min-height:96px}
</style>
</head>
<body>
<button class="btn" id="gear" aria-expanded="false" aria-controls="panel">Design</button>

<button class="btn" id="mute" aria-label="Turn music off" hidden>♪ Music on</button>
<aside id="panel" aria-label="Design your letter">
  <h2>Design your letter</h2>
  <p class="help">Changes apply instantly and are remembered in this browser.</p>
  <fieldset><legend>Envelope</legend>
    <label>Recipient <input type="text" id="to"></label>
    <label>Seal symbol <input type="text" id="seal" maxlength="2"></label>
    <label>Envelope color <input type="color" id="env"></label>
    <label>Table color <input type="color" id="desk"></label>
    <label><span>Airmail stripes</span> <input type="checkbox" id="stripes"></label>
  </fieldset>
  <fieldset><legend>Book</legend>
    <label>Cover title <input type="text" id="title"></label>
    <label>Signed by <input type="text" id="from"></label>
    <label>Cover / seal color <input type="color" id="accent"></label>
    <label>Cover image <input type="file" id="coverImg" accept="image/*"></label>
    <label>Paper color <input type="color" id="paper"></label>
    <label>Ink color <input type="color" id="ink"></label>
    <label>Page image <input type="file" id="pageImg" accept="image/*"></label>
    <label>Font <select id="font">
      <option value='"Newsreader",Georgia,serif'>Newsreader</option>
      <option value='"Kalam",cursive'>Handwriting</option>
      <option value='Georgia,serif'>Georgia</option>
      <option value='"Courier New",monospace'>Typewriter</option>
    </select></label>
    <button class="btn" id="clearImgs" type="button">Remove images</button>
  </fieldset>
  <fieldset><legend>Tooltip</legend>
    <label>Background <input type="color" id="tipBg"></label>
    <label>Text color <input type="color" id="tipFg"></label>
    <label>Shape <select id="tipShape"><option value="rounded">Rounded</option><option value="pill">Pill</option><option value="square">Square</option><option value="bubble">Bubble</option></select></label>
    <label><span>Arrow</span> <input type="checkbox" id="tipArrow"></label>
    <div id="tipdemo"><span>Tooltip preview</span></div>
  </fieldset>
  <fieldset><legend>Photos &amp; letters</legend>
    <label>Photo filter <select id="vfStyle"><option value="bw">Black &amp; white</option><option value="vintage">Vintage color</option><option value="none">None</option></select></label>
    <label>Strength <input type="range" id="vf" min="0" max="1" step="0.05"></label>
    <p class="help">Add a photo to each frame and write the letter it opens. Use <b>[word|note]</b> for a clickable word.</p>
    <div id="spotList"></div>
    <button class="btn" id="reset" type="button">Reset to example</button>
  </fieldset>
</aside>

const TIPS=["Little moments", "Family dinner", "Road trip", "Best birthday", "Late-night calls", "Lake house", "Sunday mornings", "Always there", "Dancing in the kitchen", "Rainy days", "Our song"];
const LETTERS=["Galli,\n\nIt's the little moments I treasure most: a text out of nowhere, a shared joke, a quiet coffee.\n\nLove, Robert", "My dear sister,\n\nFamily dinners are never the same without your laugh filling the room. Save me a seat next time.\n\nRobert", "Dear Galli,\n\nLet's finally take that [road trip|I'll drive. You pick the music.]. No more excuses.\n\nRobert", "Happy birthday, Galli!\n\nThis was the best birthday I can remember, mostly because you were there.\n\nRobert ♥", "Galli,\n\nThank you for the [late-night calls|Longest one: 3h 12m. We talked about nothing and it was perfect.]. They got me through more than you know.\n\nRobert", "Dear Galli,\n\nDo you remember the [lake house|Room 3, the one with the creaky floor. You swore it was haunted.]? I still think about it more than I admit.\n\nRobert", "Galli,\n\nSunday mornings, slow pancakes, and nowhere to be. I'd trade a lot to have one more with you.\n\nRobert", "My dearest sister,\n\nYou always showed up, every single time. I hope you know how much that means to me.\n\nYours always, Robert", "Galli,\n\nDancing in the kitchen, badly and loudly. Never change.\n\nRobert", "Dear Galli,\n\nRainy days make me think of you, [blanket forts|Yes, we were way too old for them.] and all. Come visit soon.\n\nRobert", "To my dearest sister,\n\nYou still owe me a rematch at cards. And a song that's ours: I'll let you pick it.\n\nHappy birthday, Galli.\n\nRobert ♥"];
const DEF={to:"For Sam",seal:"♥",env:"#f7f5ef",desk:"#1f3a4d",stripes:true,title:"For my dearest sister, Galli",from:"Robert",accent:"#a82a24",paper:"#f7f5ef",ink:"#23303a",
 font:'"Newsreader",Georgia,serif',coverImg:"",pageImg:"",letters:LETTERS,tips:TIPS,tipBg:"#23303a",tipFg:"#ffffff",tipShape:"rounded",tipArrow:true,v:3,vf:0.8,vfStyle:"bw",photos:SPOTS.map(()=>""),
 text:"Dear Galli,\n\nI've been meaning to write this for a while. Remember the [lake house|Room 3, the one with the creaky floor. You swore it was haunted.]? I still think about it more than I admit.\n---\nThank you for the [late-night calls|Longest one: 3h 12m. We talked about nothing and it was perfect.], the bad jokes, and for always showing up.\n\nNext month, let's take that [road trip|Tap a highlighted word again to hide its note.]. I'll drive. You pick the music.\n\nYours always,\nRobert\n\nP.S. You still owe me a rematch."};
let S=JSON.parse(JSON.stringify(DEF)), cur=0, leaves=[], maxCur=0;
try{const r=localStorage.getItem('letterbook3');if(r){const st=JSON.parse(r);if(!st.v){['letters','tips','photos'].forEach(k=>{if(Array.isArray(st[k]))st[k].splice(3,1)});st.v=2}if(st.v<3){['letters','tips','photos'].forEach(k=>{if(Array.isArray(st[k]))st[k].splice(0,1)});st.v=3}S={...JSON.parse(JSON.stringify(DEF)),...st}}}catch(e){}
const $=id=>document.getElementById(id), root=document.documentElement;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem('letterbook3',JSON.stringify(S))}catch(e){}};

function pageHTML(t){
  return esc(t.trim()).split(/\n{2,}/).map(p=>'<p>'+p.replace(/\n/g,'<br>').replace(/\[([^\]|]+)\|([^\]]+)\]/g,
   (m,w,n)=>'<button class="tag" aria-expanded="false" data-note="'+n+'">'+w+'</button>')+'</p>').join('');
}
function theme(){
  const st=root.style;
  st.setProperty('--desk',S.desk);st.setProperty('--env',S.env);st.setProperty('--paper',S.paper);st.setProperty('--ink',S.ink);
  st.setProperty('--accent',S.accent);st.setProperty('--font',S.font);
  S.coverImg?st.setProperty('--cover','url("'+S.coverImg+'")'):st.removeProperty('--cover');root.classList.toggle('nt',!S.coverImg);st.setProperty('--pbg',S.pageImg?'url("'+S.pageImg+'")':'none');
  $('envelope').classList.toggle('stripes',S.stripes);
  $('sealEl').textContent=S.seal;$('toEl').textContent=S.to;
  const sh={rounded:['8px','7px 12px'],pill:['999px','7px 16px'],square:['0','7px 12px'],bubble:['18px','10px 16px']}[S.tipShape]||['8px','7px 12px'];
  st.setProperty('--tipbg',S.tipBg);st.setProperty('--tipfg',S.tipFg);st.setProperty('--tipr',sh[0]);st.setProperty('--tipp',sh[1]);root.classList.toggle('noarrow',!S.tipArrow);st.setProperty('--vf',S.vf);root.classList.toggle('bw',S.vfStyle==='bw');root.classList.toggle('nf',S.vfStyle==='none');
}
function artPage(pg){
  return '<div class="page art">'+SPOTS.map((q,i)=>q.pg!==pg?'':'<button class="spot" data-i="'+i+'" aria-label="Open letter: '+esc(S.tips[i]||q.label)+'" style="left:'+q.x+'%;top:'+q.y+'%;width:'+q.w+'%;height:'+q.h+'%;clip-path:polygon('+q.poly+')"><span class="ph"'+(S.photos[i]?' style="background-image:url('+S.photos[i]+')"':' hidden')+'></span><i>\u2709</i></button>').join('')+'<img class="artimg" alt="" src="'+ART[pg]+'"></div>';
}
const tip=$('tip');
function hideTip(){tip.hidden=true}
function showTip(sp){
  const i=sp.dataset.i,r=sp.getBoundingClientRect();
  tip.innerHTML='<b>'+esc(S.tips[i]||SPOTS[i].label)+'</b><small>Click to read the letter</small>';
  tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight;
  const x=Math.max(w/2+8,Math.min(innerWidth-w/2-8,r.left+r.width/2));
  const below=r.top<h+24;tip.classList.toggle('below',below);
  tip.style.left=x+'px';tip.style.top=(below?Math.min(r.bottom,innerHeight-h-8)+10:r.top-10)+'px';
}
document.addEventListener('mouseover',e=>{const sp=e.target.closest&&e.target.closest('.spot');sp?showTip(sp):hideTip()});
document.addEventListener('focusin',e=>{const sp=e.target.closest&&e.target.closest('.spot');sp?showTip(sp):hideTip()});
document.addEventListener('focusout',hideTip);
$('book').addEventListener('mouseleave',hideTip);
let lastEl=null;
function openL(i,el){lastEl=el;
  $('lbody').innerHTML=pageHTML(S.letters[i]||'');
  $('lnote').className='lnote';$('lnote').textContent='';$('modal').hidden=false;$('modal').querySelector('.x').focus();
}
function closeL(){$('modal').hidden=true;if(lastEl)lastEl.focus()}
function spotUI(){
  $('spotList').innerHTML=SPOTS.map((q,i)=>'<div class="sp"><b>'+(i+1)+'. '+q.label+'</b><input type="text" data-t="'+i+'" placeholder="Tooltip caption" aria-label="Tooltip for '+q.label+'"><input type="file" accept="image/*" data-p="'+i+'" aria-label="Photo for '+q.label+'"><textarea data-l="'+i+'" aria-label="Letter for '+q.label+'"></textarea></div>').join('');
  $('spotList').querySelectorAll('textarea').forEach(t=>{t.value=S.letters[t.dataset.l]||'';t.addEventListener('input',()=>{S.letters[t.dataset.l]=t.value;save()})});
  $('spotList').querySelectorAll('input[type=text]').forEach(t=>{t.value=S.tips[t.dataset.t]||'';t.addEventListener('input',()=>{S.tips[t.dataset.t]=t.value;save()})});
  $('spotList').querySelectorAll('input[type=file]').forEach(f=>f.addEventListener('change',()=>{
    const file=f.files[0];if(!file)return;const im=new Image(),u=URL.createObjectURL(file);
    im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.photos[f.dataset.p]=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(u);save();build()};
    im.src=u}));
}
$('modal').addEventListener('click',e=>{
  if(e.target===$('modal')||e.target.closest('.x'))return closeL();
  const t=e.target.closest('.tag');if(!t)return;
  const open=t.getAttribute('aria-expanded')!=='true';
  $('lbody').querySelectorAll('.tag').forEach(x=>x.setAttribute('aria-expanded','false'));
  t.setAttribute('aria-expanded',open);$('lnote').textContent=t.dataset.note;$('lnote').classList.toggle('show',open);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modal').hidden)closeL()});
function build(){
  const faces=['<div class="page cover"><h1>'+esc(S.title)+'</h1><small>from '+esc(S.from)+'</small></div>',artPage(0),artPage(1)];
  const pad=faces.length%2;if(pad)faces.push('<div class="page"></div>');
  const book=$('book');book.innerHTML='';leaves=[];
  for(let i=0;i<faces.length;i+=2){
    const l=document.createElement('div');l.className='leaf';
    l.innerHTML='<div class="face">'+faces[i]+'</div><div class="face back">'+faces[i+1]+'</div>';
    book.appendChild(l);leaves.push(l);
  }
  maxCur=leaves.length-pad;cur=Math.min(cur,maxCur);show();
}
function show(){hideTip();
  leaves.forEach((l,i)=>{const fl=i<cur,was=l.classList.contains('flipped');l.classList.toggle('flipped',fl);
    if(fl!==was){l.classList.add('flipping');l.style.zIndex=leaves.length+2;setTimeout(()=>{l.classList.remove('flipping');l.style.zIndex=l.classList.contains('flipped')?i:leaves.length-i},950)}
    else if(!l.classList.contains('flipping'))l.style.zIndex=fl?i:leaves.length-i;
    const f=l.querySelectorAll('.face');f[0].inert=(i!==cur);f[1].inert=(i!==cur-1);});
  $('prev').disabled=cur===0;$('next').disabled=cur===maxCur;
  $('book').style.transform=cur===0?'translateX(-25%)':cur===leaves.length?'translateX(25%)':'none';
  $('book').className=cur===0?'s-front':cur===leaves.length?'s-back':'s-open';
  $('count').textContent=cur===0?'Cover':cur===leaves.length?'The end':'Pages '+(2*cur-1)+'–'+(2*cur);
}
$('book').addEventListener('click',e=>{
  const sp=e.target.closest('.spot');if(sp){hideTip();openL(+sp.dataset.i,sp);return}
  const t=e.target.closest('.tag');
  if(!t){const r=$('book').getBoundingClientRect(),x=(e.clientX-r.left)/r.width;if(x>.6)go(1);else if(x<.4)go(-1);return}
  const note=t.closest('.page').querySelector('.pnote'),open=t.getAttribute('aria-expanded')!=='true';
  t.closest('.page').querySelectorAll('.tag').forEach(x=>x.setAttribute('aria-expanded','false'));
  t.setAttribute('aria-expanded',open);note.textContent=t.dataset.note;note.classList.toggle('show',open);
});
const go=d=>{cur=Math.max(0,Math.min(maxCur,cur+d));show()};
$('next').onclick=()=>go(1);$('prev').onclick=()=>go(-1);
$('book').addEventListener('mousemove',e=>{const r=$('book').getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
  $('book').style.cursor=e.target.closest('.spot')?'default':(x>.6&&cur<maxCur)?'e-resize':(x<.4&&cur>0)?'w-resize':'default'});
document.addEventListener('keydown',e=>{if(!$('bookWrap').classList.contains('show')||!$('modal').hidden||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
let sx=0;$('book').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('book').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>60)go(d<0?1:-1)});

function confetti(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=document.createElement('canvas');c.setAttribute('aria-hidden','true');
  c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60';
  document.body.appendChild(c);
  const dpr=window.devicePixelRatio||1,W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr,x=c.getContext('2d');
  const cols=['#ffd6e0','#ffe8b8','#d4f0e0','#cfe4ff','#e6d6ff','#fff3b0','#ffcfd8'];
  const r=document.getElementById('envelope').getBoundingClientRect(),ox=(r.left+r.width/2)*dpr,oy=(r.top+r.height/2)*dpr;
  const P=Array.from({length:180},()=>{const a=Math.random()*Math.PI*2,v=(5+Math.random()*13)*dpr;
    return{x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-9*dpr,w:(6+Math.random()*8)*dpr,h:(4+Math.random()*6)*dpr,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0],round:Math.random()<.3}});
  const t0=performance.now();
  (function f(t){
    x.clearRect(0,0,W,H);const age=t-t0;
    P.forEach(p=>{p.vy+=.35*dpr;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      x.save();x.globalAlpha=Math.max(0,Math.min(1,(3200-age)/800));x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
      if(p.round){x.beginPath();x.arc(0,0,p.w/2.2,0,7);x.fill()}else x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    if(age<3200)requestAnimationFrame(f);else c.remove();
  })(t0);
}
const Music=(()=>{
  const MEL=[[76,0,79,0,84,0],[81,0,79,0,76,0],[77,0,81,0,84,81],[83,0,79,0,74,0],[76,79,84,0,88,0],[83,0,79,0,76,0],[77,81,84,81,77,0],[79,83,86,83,79,0]];
  const BASS=[[48,52,55],[45,52,57],[41,53,57],[43,50,55],[48,52,55],[40,52,55],[41,53,57],[43,50,59]];
  const E=.36,VOL=.32;let ctx,master,rev,step=0,next=0,started=false,muted=false;
  function init(){
    if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
    const len=ctx.sampleRate*2.2,buf=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)}
    rev=ctx.createConvolver();rev.buffer=buf;const w=ctx.createGain();w.gain.value=.5;rev.connect(w);w.connect(master);
  }
  function tone(m,t,vol){
    const f=440*Math.pow(2,(m-69)/12);
    [[1,1,2.8],[2,.1,1.4]].forEach(([k,a,d])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f*k;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*a,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(master);g.connect(rev);o.start(t);o.stop(t+d+.05);
    });
  }
  function sched(){
    while(next<ctx.currentTime+.5){
      const bar=Math.floor(step/6)%8,s=step%6,m=MEL[bar][s];
      if(m)tone(m,next,.16);
      if(s%2===0)tone(BASS[bar][s/2],next,.1);
      next+=E;step++;
    }
  }
  document.addEventListener('visibilitychange',()=>{if(ctx&&started){document.hidden?ctx.suspend():ctx.resume()}});
  return{
    prime(){init();if(ctx&&ctx.state==='suspended')ctx.resume()},
    start(){init();if(!ctx||started)return;started=true;ctx.resume();next=ctx.currentTime+.2;setInterval(sched,120);sched();
      master.gain.setTargetAtTime(muted?0:VOL,ctx.currentTime,1.2);$('mute').hidden=false},
    toggle(){muted=!muted;if(ctx)master.gain.setTargetAtTime(muted?0:VOL,ctx.currentTime,.15);return muted}
  };
})();
$('mute').onclick=()=>{const m=Music.toggle();$('mute').textContent=m?'♪ Music off':'♪ Music on';$('mute').setAttribute('aria-label',m?'Turn music on':'Turn music off')};
let taps=0;
$('hint').setAttribute('aria-live','polite');
$('envelope').onclick=()=>{
  const e=$('envelope');if(taps>=3)return;taps++;Music.prime();
  e.style.setProperty('--amp',[0,4,7,11][taps]);
  e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');
  if(taps<3){$('hint').textContent=taps===1?"It's stuck. Tap 2 more times":'Almost there. Tap once more';return}
  $('hint').style.display='none';
  setTimeout(()=>{e.classList.remove('shake');e.classList.add('open');confetti();Music.start();
    setTimeout(()=>{e.style.display='none';$('bookWrap').classList.add('show')},450)},550);
};

/* Designer */
const fields=['to','seal','env','desk','title','from','accent','paper','ink','font','tipBg','tipFg','tipShape','vf','vfStyle'];
function sync(){fields.forEach(k=>$(k).value=S[k]);$('stripes').checked=S.stripes;$('tipArrow').checked=S.tipArrow}
fields.forEach(k=>$(k).addEventListener('input',()=>{S[k]=$(k).value;save();theme();if(['title','from'].includes(k))build()}));
$('stripes').onchange=()=>{S.stripes=$('stripes').checked;save();theme()};
$('tipArrow').onchange=()=>{S.tipArrow=$('tipArrow').checked;save();theme()};
['coverImg','pageImg'].forEach(k=>$(k).addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{S[k]=r.result;save();theme()};r.readAsDataURL(f);
}));
$('clearImgs').onclick=()=>{S.coverImg=S.pageImg='';$('coverImg').value=$('pageImg').value='';save();theme()};
$('reset').onclick=()=>{S=JSON.parse(JSON.stringify(DEF));save();sync();spotUI();theme();build()};
$('gear').onclick=()=>{const o=$('panel').classList.toggle('show');$('gear').setAttribute('aria-expanded',o);$('gear').textContent=o?'Close':'Design'};
sync();theme();build();spotUI();
</script>
